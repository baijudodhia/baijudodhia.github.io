<template id="search-box-template">
  <div
    id="search-box"
    class="search-box"
  >
    <button
      id="search-box-trigger"
      class="search-box-trigger"
      type="button"
      aria-haspopup="dialog"
      aria-expanded="false"
    >
      <i
        id="search-box-icon"
        class="search-box-icon"
        aria-hidden="true"
      ></i>
      <span
        id="search-box-label"
        class="search-box-label"
      ></span>
      <kbd
        id="search-box-shortcut"
        class="search-box-shortcut"
        aria-hidden="true"
      ></kbd>
    </button>

    <dialog
      id="search-box-dialog"
      class="search-box-dialog"
      aria-label="Search"
    >
      <div
        id="search-box-panel"
        class="search-box-panel"
      >
        <div class="search-box-field">
          <i
            id="search-box-field-icon"
            class="search-box-field-icon"
            aria-hidden="true"
          ></i>
          <input
            id="search-box-input"
            class="search-box-input"
            type="text"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="true"
            aria-controls="search-box-list"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <kbd
            class="search-box-esc"
            aria-hidden="true"
            >Esc</kbd
          >
        </div>

        <ul
          id="search-box-list"
          class="search-box-list"
          role="listbox"
          aria-label="Results"
        ></ul>

        <p
          id="search-box-empty"
          class="search-box-empty"
          hidden
        ></p>

        <p
          id="search-box-status"
          class="search-box-status"
          role="status"
          aria-live="polite"
        ></p>

        <p
          id="search-box-footer"
          class="search-box-footer"
        ></p>
      </div>
    </dialog>
  </div>
</template>
